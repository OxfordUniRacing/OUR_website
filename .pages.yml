# Pages CMS Configuration
# This file configures the content management system for the Oxford University Racing website

# Media configuration
media:
  input: public/images
  output: /images

# Content collections
content:
  # Cars
  - name: cars
    label: Cars
    path: content/cars
    type: collection
    filename:
      template: "{primary}.md"
      field: create
    fields:
      - name: title
        label: Car Name
        type: string
        required: true
      - name: season
        label: Season
        type: string
        required: true
        description: For example, 2025-2026
      - name: featuredImage
        label: Featured Image
        type: image
        required: true
      - name: excerpt
        label: Excerpt
        type: text
        required: true
        description: Brief summary (max 200 characters)
      - name: weight
        label: Weight
        type: number
        required: true
        description: In kg
      # - name: peakPower
      #   label: Peak Power
      #   type: number
      #   required: true
      #   description: In kW
      - name: overallPlace
        label: Overall Place
        type: string
        required: true
        description: Overall place in the competition (e.g., 1st for first place)
      - name: designPlace
        label: Design Place
        type: string
        required: true
        description: Design place in the competition (e.g., 1st for first place)
      - name: costPlace
        label: Cost Place
        type: string
        required: true
        description: Cost place in the competition (e.g., 1st for first place)
      - name: buisinessPlace
        label: Business Place
        type: string
        required: true
        description: Business place in the competition (e.g., 1st for first place)
      - name: accelerationPlace
        label: Acceleration Place
        type: string
        required: false
        description: Acceleration place in the competition (e.g., 1st for first place)
      - name: skidpadPlace
        label: Skidpad Place
        type: string
        required: false
        description: Skidpad place in the competition (e.g., 1st for first place)
      - name: sprintPlace
        label: Sprint Place
        type: string
        required: false
        description: Sprint place in the competition (e.g., 1st for first place)
      - name: endurancePlace
        label: Endurance Place
        type: string
        required: false
        description: Endurance place in the competition (e.g., 1st for first place)
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown
  
  # News Articles
  - name: news
    label: News Articles
    path: content/news
    type: collection
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: author
        label: Author
        type: string
        required: true
      - name: featuredImage
        label: Featured Image
        type: image
        required: false
      - name: excerpt
        label: Excerpt
        type: text
        required: true
        description: Brief summary (max 200 characters)
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown

  # Team Members
  - name: team
    label: Team Members
    path: content/team
    type: collection
    filename:
      template: "{primary}.md"
      field: create
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: Full name of team member
      - name: role
        label: Role
        type: string
        required: true
        description: Position or title (e.g., Team Principal, Lead Engineer)
      - name: subteam
        label: Sub-team
        type: select
        required: true
        options:
          values:
            - leadership
            - bodywork and aerodynamics
            - cooling
            - chassis
            - powertrain
            - battery
            - simulations
            - electronics
            - wheel assembly
            - operations
        description: Which sub-team the member belongs to
      - name: image
        label: Profile Image
        type: image
        required: false
        description: Professional headshot (square format recommended)
      - name: email
        label: Email
        type: string
        required: false
        description: Contact email (optional)
      - name: linkedin
        label: LinkedIn
        type: string
        required: false
        description: LinkedIn profile URL (optional)
      - name: year
        label: Year of Study
        type: number
        required: true
        description: Current year of study
      - name: course
        label: Course
        type: string
        required: true
        description: Degree program
      - name: body
        label: Bio
        type: text
        required: false
        description: Brief background, interests, and role description (max 200 characters)

  # Sponsors/Partners
  - name: sponsors
    label: Partners
    path: content/sponsors
    type: collection
    filename:
      template: "{primary}.md"
      field: create
    fields:
      - name: name
        label: Name
        type: string
        required: true
        description: Organization or company name
      - name: logo
        label: Logo
        type: image
        required: true
        description: Upload company logo (PNG/JPG, high resolution recommended)
      - name: website
        label: Website
        type: string
        required: false
        description: Company website URL (optional)
      - name: since
        label: Partner Since
        type: number
        required: false
        description: Year partnership began (optional)
      - name: order
        label: Display Position
        type: number
        required: true
        default: 1
        options:
          min: 1
        description: Position on the page (1 = first, 2 = second, etc.). If multiple sponsors have the same position, they will be sorted alphabetically.
      - name: body
        label: Description
        type: rich-text
        required: true
        description: Brief description of the organization and partnership

  # Static Pages
  - name: pages
    label: Pages
    path: content/pages
    type: collection
    filename: "{{title}}"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Content
        type: rich-text
        required: true